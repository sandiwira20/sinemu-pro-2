<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Decorative Pattern Grid Dots -->
  <g opacity="0.35" fill="#94A3B8">
    <circle cx="160" cy="100" r="2.5"/>
    <circle cx="200" cy="100" r="2.5"/>
    <circle cx="240" cy="100" r="2.5"/>
    <circle cx="160" cy="140" r="2.5"/>
    <circle cx="200" cy="140" r="2.5"/>
    <circle cx="240" cy="140" r="2.5"/>
    <circle cx="560" cy="340" r="2.5"/>
    <circle cx="600" cy="340" r="2.5"/>
    <circle cx="640" cy="340" r="2.5"/>
    <circle cx="560" cy="380" r="2.5"/>
    <circle cx="600" cy="380" r="2.5"/>
    <circle cx="640" cy="380" r="2.5"/>
  </g>

  <!-- Central Card Badge -->
  <g transform="translate(260, 95)" filter="url(#subtleShadow)">
    <rect width="280" height="290" rx="24" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Icon Container Circle -->
    <rect x="90" y="44" width="100" height="100" rx="50" fill="#EEF2FF"/>
    
    <!-- Camera/Image Outline Icon -->
    <g transform="translate(116, 70)" stroke="url(#accentGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Main Photo Frame -->
      <rect x="2" y="6" width="44" height="34" rx="8" />
      <!-- Circle / Sun -->
      <circle cx="15" cy="18" r="4" fill="url(#accentGrad)" stroke="none" />
      <!-- Mountain / Hill -->
      <path d="M44 32 L32 18 L20 32" stroke-width="3" />
      <path d="M22 28 L17 22 L4 35" stroke-width="2.5" />
    </g>

    <!-- Text -->
    <text x="140" y="185" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1E293B">
      Foto Tidak Tersedia
    </text>
    
    <text x="140" y="212" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B">
      Laporan tanpa lampiran foto
    </text>

    <!-- Pill Tag -->
    <g transform="translate(85, 236)">
      <rect width="110" height="24" rx="12" fill="#E0E7FF"/>
      <text x="55" y="16.5" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4338CA" letter-spacing="0.5">
        SINEMU ITEM
      </text>
    </g>
  </g>
</svg>
