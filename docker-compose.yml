services:
  app:
    build: .
    container_name: sinemu-app
    restart: always
    ports:
      - "8082:80"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - storage_data:/var/www/html/storage/app/public
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: sinemu_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

volumes:
  db_data:
  storage_data:

networks:
  app-network: